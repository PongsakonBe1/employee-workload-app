<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>labboy · UI review board</title><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap');
*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#f0f2f5,#f4f4f6 55%,#edf1ee);color:#1d1d1f;font:14px/1.6 'IBM Plex Sans Thai',sans-serif}header{padding:42px 4vw 30px}header h1{font-size:32px;font-weight:600;margin:0 0 8px;letter-spacing:-.7px}header p{margin:0;color:#53647b}nav{display:flex;flex-wrap:wrap;gap:8px;padding:0 4vw 30px}button,a{font:inherit}button{padding:9px 17px;border-radius:12px;border:1px solid #ffffff;background:#ffffff99;color:#334a68;cursor:pointer}button.active{background:#1d66db;color:white;border-color:#1d66db}main{padding:0 4vw 40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}article{min-width:0}article>a{display:block;border-radius:17px;overflow:hidden;border:1px solid #fff;box-shadow:0 6px 20px #273f6210;background:#fff}article img{width:100%;display:block;height:300px;object-fit:cover;object-position:top}article h2{font-size:14px;margin:11px 0 0;font-weight:500}article p{font-size:11px;color:#596a80;margin:3px 0}a{color:inherit;text-decoration:none}header>a{display:inline-block;margin-top:15px;color:#165bcc}body[data-device=mobile] main{grid-template-columns:repeat(6,minmax(0,1fr))}body[data-device=mobile] article img{height:340px}body[data-theme=dark]{background:linear-gradient(135deg,#202124,#19191c,#252627);color:#ecf3ff}body[data-theme=dark] p,body[data-theme=dark] article p{color:#b4c4d9}body[data-theme=dark] article>a{border-color:#496078}body[data-theme=dark] button{background:#2a3a51;color:#d2e0f5;border-color:#526980}body[data-theme=dark] button.active{background:#9ec4ff;color:#162f51}body[data-theme=dark] header>a{color:#a8caff}@media(max-width:760px){header{padding:25px 20px}header h1{font-size:25px}nav{padding:0 20px 20px}main{padding:0 20px 30px;grid-template-columns:1fr}body[data-device=mobile] main{grid-template-columns:repeat(2,minmax(0,1fr))}article img{height:260px}}
</style></head><body data-theme="light" data-device="desktop"><header><div style="font-size:10px;letter-spacing:2px;color:#60758f">LABBOY WORKLOAD · DESIGN REVIEW 04</div><h1>หนึ่งภาษาภาพ สำหรับทุกงานของทีม</h1><p>Liquid Glass · 30 มุมมอง · Desktop & Mobile · Light & Dark</p><a href="index.html#/dashboard">เปิดต้นแบบที่กดใช้งานได้ →</a></header><nav aria-label="ตัวเลือกบอร์ด"><button data-theme="light" class="active">Light</button><button data-theme="dark">Dark</button><span style="width:12px"></span><button data-device="desktop" class="active">Desktop</button><button data-device="mobile">Mobile</button><button id="show-all">แสดงครบทุกหน้า</button></nav><main id="board"></main><script>
const views=[['dashboard','ภาพรวมการทำงาน'],['record','บันทึกงาน'],['dl','ตารางสอบ DL'],['equipment','จัดการอุปกรณ์'],['usage','การใช้งานอุปกรณ์'],['staff','Staff Analytics'],['classrooms','ตารางเรียน'],['worklogs','รายการงาน'],['settings','ตั้งค่า'],['profile','โปรไฟล์'],['templates','บันทึกด่วนและ Combo'],['export','ส่งออกข้อมูล'],['users','ผู้ใช้'],['admin','ศูนย์ผู้ดูแล'],['system','จัดการระบบ'],['audit','ประวัติระบบ'],['imports','นำเข้าจากรูป'],['broadcast','ประกาศ'],['cleanup','ตรวจข้อมูลซ้ำ'],['help','คู่มือ'],['login','เข้าสู่ระบบ'],['pending','รออนุมัติ'],['new-log','กรอกบันทึกงาน'],['design','ชุด UI และสถานะ'],['resources','ห้องและทรัพยากร'],['condition','สภาพและประวัติคืน'],['export-requests','คำขอส่งออก'],['data-import','นำเข้าข้อมูลงาน'],['notifications','การแจ้งเตือน'],['about','เกี่ยวกับแอป']];let all=false;
function render(){const root=document.body.dataset;document.querySelector('#board').innerHTML=(all?views:views.slice(0,9)).map(([id,title])=>`<article><a href="index.html#/${id}"><img src="../../../../output/playwright/ux-phase1/revision4/${id}-${root.device}-${root.theme}.png" alt="แบบ ${title}" loading="lazy"></a><h2>${title}</h2><p>${root.device==='desktop'?'1440 px':'390 px'} · ${root.theme==='dark'?'Dark':'Light'}</p></article>`).join('');}
document.querySelectorAll('button[data-theme],button[data-device]').forEach(b=>b.onclick=()=>{for(const name of ['theme','device'])if(b.dataset[name]){document.body.dataset[name]=b.dataset[name];document.querySelectorAll('button[data-'+name+']').forEach(c=>c.classList.toggle('active',c===b));}render();});document.querySelector('#show-all').onclick=()=>{all=!all;document.querySelector('#show-all').textContent=all?'แสดงหน้าหลัก':'แสดงครบทุกหน้า';render();};render();
</script></body></html>
